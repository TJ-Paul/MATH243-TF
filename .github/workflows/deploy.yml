name: Publish website

# The site is plain files (index.html + assets/ + the .md notes), rendered in
# the browser. This copies them to the gh-pages branch, which GitHub Pages serves.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the notes
        uses: actions/checkout@v4

      - name: Rebuild the note list
        run: python3 build-site-index.py

      - name: Collect site files
        run: |
          mkdir -p public
          rsync -a \
            --exclude '.git' --exclude '.github' --exclude '.obsidian' \
            --exclude '.quartz-build' --exclude 'scripts' --exclude 'public' \
            --exclude '.DS_Store' \
            ./ public/

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
